root = "."
tmp_dir = "tmp"

[build]
  # Command to build the binary.
  cmd = "go build -o ./tmp/main ./cmd/backend/main.go"
  bin = "./tmp/main"
  # Delay before triggering a rebuild after a change (ms).
  delay = 500
  # Kill the running process before rebuilding.
  kill_delay = "200ms"
  # Send interrupt signal before killing the process.
  send_interrupt = true
  # Directories to exclude from watching.
  exclude_dir = ["assets", "tmp", "vendor", "frontend"]
  # Watch these file extensions for changes.
  include_ext = ["go", "tpl", "html", "toml"]
  exclude_regex = ["_test.go"]
  # Print build log on failure.
  log = "build-errors.log"

[log]
time = false
main_only = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp dir on exit.
  clean_on_exit = true